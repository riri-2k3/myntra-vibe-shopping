<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Myntra Vibe Shopping</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
   <div class="full-width-container">
    <div class="content-container">
        <header class="nav">
            <div class="desktop-preHeaderContent">
                <a class="desktop-preHeaderLinks" href="/myntrainsider">Myntra Insider</a>
                <a class="desktop-preHeaderLinks" href="/contactus">Contact Us</a>
            </div>

          <div class="desktop-mainHeader">
                <div class="desktop-logoContainer">
  <a href="/">
    <img 
      src="myntra-transparent-icon-free-png.webp" 
      alt="Myntra Logo" 
      class="logo"
    >
  </a>
</div>

                <nav class="desktop-navbar">
                    <a href="index.html">Home</a>
                    <a href="explore.html">Vibe Search</a>
                    <a href="explore.html">Trend Radar</a>
                    <a href="index.html">Men</a>
                    <a href="index.html">Women</a>
                    <a href="index.html">Kids</a>
                    <a href="index.html">Home & Living</a>
                </nav>
                <div class="desktop-query">
                    <input type="text" placeholder="Search for products, brands and more" />
                </div>
                <div class="desktop-actions">
                    <a href="/wishlist" class="desktop-wishlist">
                        <i class="fa-regular fa-heart"></i>
                        <span class="desktop-userTitle">Wishlist</span>
                    </a>

                    <a href="/checkout/cart" class="desktop-cart">
                      <i class="fa-solid fa-bag-shopping"></i>
                        <span class="desktop-badge desktop-grey">0</span>
                        <span class="desktop-userTitle">Bag</span>
                    </a>
                </div>

            </div>
        </header>
    </div>
</div>

  <div class="full-width-container hero-container">
    <div class="content-container">
      <section class="hero" id="home">
        <h1>Shop by Vibe, Not Keywords ✨</h1>
        <p>Describe your mood, moment, or aesthetic and let AI find your perfect fit.</p>

        <div class="search-row" role="search">
          <div class="search-input">
            <input id="mainSearch" type="text" placeholder="Search by vibe, mood, or moment..." />
            <button class="search-btn" onclick="triggerSearch()">Search</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- ✅ Shared Script -->
  <script src="main.js"></script>
</body>
</html>
